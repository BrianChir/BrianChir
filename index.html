<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YodaAI 4Ls Retro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css">
  <script defer src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mdc-typography">
  <header class="mdc-top-app-bar mdc-top-app-bar--fixed">
    <div class="mdc-top-app-bar__row">
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
        <span class="mdc-top-app-bar__title">YodaAI 4Ls Retro</span>
      </section>
    </div>
  </header>
  <main class="main-content">
    <div class="mdc-tab-bar" role="tablist">
      <div class="mdc-tab-scroller">
        <div class="mdc-tab-scroller__scroll-area">
          <div class="mdc-tab-scroller__scroll-content">
            <button class="mdc-tab mdc-tab--active" role="tab" aria-selected="true" tabindex="0" data-category="liked">
              <span class="mdc-tab__content">
                <span class="mdc-tab__text-label">Liked</span>
              </span>
              <span class="mdc-tab-indicator mdc-tab-indicator--active"><span class="mdc-tab-indicator__content mdc-tab-indicator__content--underline"></span></span>
              <span class="mdc-tab__ripple"></span>
            </button>
            <button class="mdc-tab" role="tab" aria-selected="false" tabindex="0" data-category="lacked">
              <span class="mdc-tab__content">
                <span class="mdc-tab__text-label">Lacked</span>
              </span>
              <span class="mdc-tab-indicator"><span class="mdc-tab-indicator__content mdc-tab-indicator__content--underline"></span></span>
              <span class="mdc-tab__ripple"></span>
            </button>
            <button class="mdc-tab" role="tab" aria-selected="false" tabindex="0" data-category="learned">
              <span class="mdc-tab__content">
                <span class="mdc-tab__text-label">Learned</span>
              </span>
              <span class="mdc-tab-indicator"><span class="mdc-tab-indicator__content mdc-tab-indicator__content--underline"></span></span>
              <span class="mdc-tab__ripple"></span>
            </button>
            <button class="mdc-tab" role="tab" aria-selected="false" tabindex="0" data-category="longed">
              <span class="mdc-tab__content">
                <span class="mdc-tab__text-label">Longed For</span>
              </span>
              <span class="mdc-tab-indicator"><span class="mdc-tab-indicator__content mdc-tab-indicator__content--underline"></span></span>
              <span class="mdc-tab__ripple"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="panes">
      <section class="pane active" data-category="liked">
        <ul class="mdc-list items"></ul>
      </section>
      <section class="pane" data-category="lacked">
        <ul class="mdc-list items"></ul>
      </section>
      <section class="pane" data-category="learned">
        <ul class="mdc-list items"></ul>
      </section>
      <section class="pane" data-category="longed">
        <ul class="mdc-list items"></ul>
      </section>
    </div>
    <div class="input-area">
      <label class="mdc-text-field mdc-text-field--outlined">
        <input type="text" class="mdc-text-field__input" id="message-input">
        <span class="mdc-notched-outline">
          <span class="mdc-notched-outline__leading"></span>
          <span class="mdc-notched-outline__notch">
            <span class="mdc-floating-label" id="my-label-id">Add item</span>
          </span>
          <span class="mdc-notched-outline__trailing"></span>
        </span>
      </label>
      <button class="mdc-button mdc-button--raised" id="submit-btn">
        <span class="mdc-button__label">Submit</span>
      </button>
    </div>
    <aside class="summary">
      <h2 class="mdc-typography--headline6">Summary</h2>
      <div id="summary-liked" class="summary-block"></div>
      <div id="summary-lacked" class="summary-block"></div>
      <div id="summary-learned" class="summary-block"></div>
      <div id="summary-longed" class="summary-block"></div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
